# StrikeOpsXR - resolución VR
# Se aplica al guardar este fichero, sin reiniciar el juego.
#
# VRRenderScale: factor sobre la resolución recomendada por el runtime (0.3 - 2.5).
#   1.0 = la recomendada, 1.2 = más nítido (más GPU), 0.8 = más rápido.
VRRenderScale=1.0
#1.2 =  2400x2520 por ojo (recomendada 2000 de ancho)
# VREyeWidth: ancho en píxeles de cada ojo. Si es mayor que 0, manda sobre VRRenderScale.
#   El alto sigue la proporción del casco. 0 = usar VRRenderScale.
VREyeWidth=0
